name: .NET Continuous Integration

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Throwaway database that only lives for this job; unique per run so no static password sits in the repo
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      MIN_LINE_COVERAGE: 65

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: EducationPlatformDB_Test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        # The app targets .NET 9; the test projects target .NET 10 (Mvc.Testing 10), so both SDKs are needed
        dotnet-version: |
          9.0.x
          10.0.x
        cache: true
        cache-dependency-path: 'EducationPlatform/EducationPlatform.sln'

    - name: Restore dependencies
      run: dotnet restore EducationPlatform/EducationPlatform.sln

    - name: Check code formatting
      run: dotnet format EducationPlatform/EducationPlatform.sln --verify-no-changes --no-restore

    - name: Build project
      run: dotnet build EducationPlatform/EducationPlatform.sln --configuration Release --no-restore

    - name: Security scan for NuGet packages
      run: |
        OUTPUT=$(dotnet list EducationPlatform/EducationPlatform.sln package --vulnerable --include-transitive)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
          echo "Vulnerable packages found!"
          exit 1
        fi

    - name: Run unit tests with coverage
      run: >
        dotnet test EducationPlatform/tests/UnitTests
        --configuration Release --no-build --verbosity minimal
        --logger trx --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Enforce coverage of the Domain and Application layers
      run: python3 .github/scripts/check-coverage.py coverage "$MIN_LINE_COVERAGE"

    - name: Run integration tests
      run: dotnet test EducationPlatform/tests/IntegrationTests --configuration Release --no-build --verbosity minimal --logger trx
      env:
        TEST_DB_CONNECTION_STRING: Host=localhost;Database=EducationPlatformDB_Test;Username=postgres;Password=${{ env.TEST_DB_PASSWORD }}

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/**/coverage.cobertura.xml

  docker:
    # Builds the production image on every run (so a broken Dockerfile fails the pull request), scans it, and
    # publishes it only for a push to main, after the tests above passed.
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      IMAGE: lolisuki18/education-platform-be
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: ${{ env.IMAGE }}:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.IMAGE }}:scan
        severity: CRITICAL,HIGH
        # Only fail on problems that already have a fix: nothing can be done about the rest
        ignore-unfixed: true
        exit-code: '1'

    - name: Login to Docker Hub
      if: env.PUBLISH == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push image
      if: env.PUBLISH == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        cache-from: type=gha
