name: .NET Continuous Integration

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Throwaway database that only lives for this job; unique per run so no static password sits in the repo
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      MIN_LINE_COVERAGE: 65

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: EducationPlatformDB_Test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        cache: true
        cache-dependency-path: 'EducationPlatform/EducationPlatform.sln'

    - name: Restore dependencies
      run: dotnet restore EducationPlatform/EducationPlatform.sln

    - name: Check code formatting
      run: dotnet format EducationPlatform/EducationPlatform.sln --verify-no-changes --no-restore

    - name: Build project
      run: dotnet build EducationPlatform/EducationPlatform.sln --configuration Release --no-restore

    - name: Security scan for NuGet packages
      run: |
        OUTPUT=$(dotnet list EducationPlatform/EducationPlatform.sln package --vulnerable --include-transitive)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
          echo "Vulnerable packages found!"
          exit 1
        fi

    - name: Run unit tests with coverage
      run: >
        dotnet test EducationPlatform/tests/UnitTests
        --configuration Release --no-build --verbosity minimal
        --logger trx --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Enforce coverage of the Domain and Application layers
      run: python3 .github/scripts/check-coverage.py coverage "$MIN_LINE_COVERAGE"

    - name: Run integration tests
      run: dotnet test EducationPlatform/tests/IntegrationTests --configuration Release --no-build --verbosity minimal --logger trx
      env:
        TEST_DB_CONNECTION_STRING: Host=localhost;Database=EducationPlatformDB_Test;Username=postgres;Password=${{ env.TEST_DB_PASSWORD }}

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/**/coverage.cobertura.xml
