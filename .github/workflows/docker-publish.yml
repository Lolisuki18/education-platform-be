name: Docker Publish Backend

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Throwaway database that only lives for this job; unique per run so no static password sits in the repo
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: EducationPlatformDB_Test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore EducationPlatform/EducationPlatform.sln

      - name: Build
        run: dotnet build EducationPlatform/EducationPlatform.sln --no-restore --configuration Release

      - name: Run all tests (unit + integration)
        run: dotnet test EducationPlatform/EducationPlatform.sln --no-build --configuration Release
        env:
          TEST_DB_CONNECTION_STRING: "Host=localhost;Database=EducationPlatformDB_Test;Username=postgres;Password=${{ env.TEST_DB_PASSWORD }}"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Nếu Dockerfile nằm ở thư mục gốc của project
          push: true
          tags: |
            lolisuki18/education-platform-be:latest
            lolisuki18/education-platform-be:${{ github.sha }}
